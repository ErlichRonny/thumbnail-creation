services:
  api:
    build: .
    ports:
      - "8000:8080"
    env_file:
      - .env
    depends_on:
      - postgres
    volumes:
      - image_storage:/data/storage

  worker:
    build: .
    command: python -m app.worker
    env_file:
      - .env
    depends_on:
      - postgres
    volumes:
      - image_storage:/data/storage

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: thumbnails
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  image_storage:
